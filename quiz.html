<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PHANTASMA // VERIFICAÇÃO I // V78 MOBILE</title>
<style>
:root{
  --bg:#050706;--panel:rgba(8,12,9,.88);--line:rgba(218,236,224,.10);
  --fg:#e8eee9;--muted:#78837b;--green:#8fd2a6;--red:#d96f78;--amber:#c9b77f;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#030403;color:var(--fg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  min-height:100dvh;display:grid;place-items:center;padding:18px;overflow-x:hidden;
  background:
    radial-gradient(circle at 50% -15%,rgba(87,128,101,.10),transparent 36%),
    linear-gradient(180deg,#070a08 0%,#020302 78%);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;
  background:
    linear-gradient(90deg,transparent 0 49.8%,rgba(255,255,255,.025) 50%,transparent 50.2%),
    linear-gradient(0deg,transparent 0 49.8%,rgba(255,255,255,.018) 50%,transparent 50.2%);
  background-size:72px 72px;
}
.wrap{width:min(860px,100%);position:relative;z-index:2}
.eyebrow{display:flex;justify-content:space-between;gap:16px;color:#68746c;font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:12px}
.pips{display:flex;gap:7px;align-items:center}.pip{width:7px;height:7px;border-radius:50%;border:1px solid #536158;background:transparent;transition:.35s}
.pip.on{background:var(--green);border-color:var(--green);box-shadow:0 0 14px rgba(143,210,166,.28)}
.card{border:1px solid var(--line);background:var(--panel);box-shadow:0 30px 100px rgba(0,0,0,.55);padding:clamp(24px,5vw,52px);min-height:390px;display:flex;flex-direction:column;justify-content:center;transition:opacity .28s ease,transform .28s ease,filter .28s ease}
.card.switching{opacity:0;transform:translateY(6px);filter:blur(4px)}
.card.arrive{animation:questionArrive .48s cubic-bezier(.2,.8,.2,1) both}
@keyframes questionArrive{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.type{color:#69756d;font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:18px}
.question{font-size:clamp(26px,4.2vw,45px);line-height:1.12;font-weight:650;letter-spacing:-.035em;max-width:790px}
.answer-zone{margin-top:34px}
input{
  width:100%;border:0;border-bottom:1px solid rgba(231,240,234,.18);background:transparent;color:var(--fg);
  padding:14px 2px;font:inherit;font-size:clamp(17px,2.6vw,22px);outline:0
}
input:focus{border-color:rgba(143,210,166,.58)}
.actions{display:flex;gap:10px;margin-top:18px}
button{
  appearance:none;border:1px solid rgba(143,210,166,.30);background:rgba(0,0,0,.20);color:#cfe2d5;
  min-height:46px;padding:11px 18px;font:600 12px/1 inherit;letter-spacing:.08em;cursor:pointer
}
button:hover,button:focus-visible{border-color:var(--green);background:rgba(143,210,166,.07)}
.bool{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bool button{min-height:62px;font-size:13px}
.feedback{min-height:23px;margin-top:18px;color:#7e8b82;font-size:12px;line-height:1.5}
.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}
.meta{margin-top:15px;color:#4e5952;font-size:9px;letter-spacing:.09em}
.shake{animation:shake .35s ease}@keyframes shake{25%{transform:translateX(4px)}50%{transform:translateX(-3px)}75%{transform:translateX(2px)}}
.curtain{position:fixed;inset:0;z-index:50;background:#020302;display:grid;place-items:center;opacity:0;pointer-events:none;transition:.35s}
.curtain.show{opacity:1;pointer-events:auto}.bits{font-family:ui-monospace,monospace;color:#789383;opacity:.44;font-size:12px;line-height:1.7;letter-spacing:.2em;text-align:center;width:min(820px,94vw);word-break:break-all}
@media(max-width:620px){body{padding:12px}.card{min-height:460px;padding:24px 18px}.bool{grid-template-columns:1fr}.eyebrow{font-size:9px}}

/* V78 MOBILE */
@media(max-width:620px){
  body{
    padding:
      max(12px,env(safe-area-inset-top))
      max(12px,env(safe-area-inset-right))
      max(12px,env(safe-area-inset-bottom))
      max(12px,env(safe-area-inset-left));
    place-items:start center;
  }
  .wrap{margin:auto 0}
  .question{
    overflow-wrap:anywhere;
    hyphens:auto;
  }
  .actions{flex-direction:column}
  .actions button{width:100%;min-height:48px}
  input{font-size:16px}
}
@media(max-height:640px){
  .card{
    min-height:0;
    justify-content:flex-start;
    padding-top:22px;
    padding-bottom:22px;
  }
  .answer-zone{margin-top:24px}
  .question{font-size:clamp(24px,7vw,34px)}
}

</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow"><span>PHANTASMA // VERIFICAÇÃO I</span><span class="pips" id="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i></span></div>
  <section class="card" id="card">
    <div class="type" id="typeLabel"></div>
    <div class="question" id="question"></div>
    <div class="answer-zone" id="answerZone"></div>
    <div class="feedback" id="feedback"></div>
    <div class="meta" id="meta"></div>
  </section>
</main>
<div class="curtain" id="curtain"><div class="bits" id="bits"></div></div>
<script>
"use strict";
const QUESTIONS=[{"id":1,"type":"text","q":"Qual é o nome do atirador de Westbrigde?","answers":["Luke","Luke Hancey"]},{"id":2,"type":"text","q":"Qual o valor do colar que o Killian compra no leilão da Charlotte?","answers":["200mil","200 mil","200k","200 K","200.000","200.000,00","200000","200000,00","duzentos mil"],"special":"money200k"},{"id":3,"type":"text","q":"Qual era o desenho dentro da cápsula da Ivy?","answers":["Medusa"]},{"id":4,"type":"text","q":"O que deixam no armário de Olívia em Albatroz?","answers":["pé","um pé"]},{"id":5,"type":"text","q":"Qual pássaro é o símbolo de liberdade e maldição que plana entre o céu e o mar?","answers":["Albatroz"]},{"id":6,"type":"text","q":"Quem é o autor do soneto favorito da Olívia?","answers":["Shakespeare"]},{"id":7,"type":"text","q":"Em qual dedo o Dex tem um Bambi tatuado?","answers":["dedo anelar","anelar"]},{"id":8,"type":"text","q":"Quem disse “Sou um assassino, não um traidor”?","answers":["Dex","Dexter"]},{"id":9,"type":"text","q":"O que a Olívia usou para causar alergia no Dex?","answers":["batom de canela","canela"]},{"id":10,"type":"text","q":"O que significa OPPV?","answers":["obsessão patológica por você"]},{"id":11,"type":"text","q":"Em qual braço fica a tatuagem do Declan?","answers":["direito","braço direito","no braço direito"]},{"id":12,"type":"text","q":"Qual o nome da irmã da Olívia?","answers":["Emily"]},{"id":13,"type":"text","q":"Por quantos minutos o Dex diz que o cérebro humano vive para revisitar os melhores minutos da sua vida?","answers":["7","7 minutos","por 7 minutos"]},{"id":14,"type":"text","q":"“Não é um segredo que nós estamos transando, mas eu não assumiria um homem rodado principalmente quando não temos nada sério.” De quem é essa frase?","answers":["Charlotte","Char"]},{"id":15,"type":"text","q":"Qual foi a tatuagem de henna que o Declan fez na Charlotte?","answers":["mariposa","uma mariposa"]},{"id":16,"type":"text","q":"Quem disse “Você fica linda quando está me desprezando”?","answers":["Declan"]},{"id":17,"type":"text","q":"Quem disse “Uma garota bonita que pode me matar? Não vejo nenhuma desvantagem.”?","answers":["Declan"]},{"id":18,"type":"text","q":"De quem é o pensamento “Eu queimaria o mundo inteiro. E ainda a carregaria no colo, por cima das cinzas.”?","answers":["Declan"]},{"id":19,"type":"text","q":"Quem chama a Melissa de “pequena praga”?","answers":["Phantasma"]},{"id":20,"type":"boolean","q":"Quando Killian era adolescente, ele se cortou para fazer Melissa notá-lo e obrigou Declan a conseguir que apenas os pais dela cuidassem dele.","answer":true},{"id":21,"type":"boolean","q":"Quando o pai de Declan causou um vexame em um evento, Killian e Dex caíram no soco de propósito para tirar o foco da mídia dele.","answer":true},{"id":22,"type":"boolean","q":"Foi Olívia quem deu a ideia de fazer um pacto com sangue e contar segredos para unir ainda mais o grupo, transformando-os nos Cisnes de New York.","answer":false},{"id":23,"type":"boolean","q":"Zuri é, na verdade, o 8º Cisne, e Caspian foi apenas uma forma de desviar o assunto dela.","answer":false},{"id":24,"type":"boolean","q":"Reid teve uma overdose porque usava drogas e inventou que Caspian o havia drogado apenas para se safar e continuar jogando.","answer":false},{"id":25,"type":"text","q":"Como era o nome da babá da Melissa?","answers":["Flora"]},{"id":26,"type":"text","q":"Como Killian chamava Melissa quando queria irritá-la?","answers":["mudinha"]},{"id":27,"type":"text","q":"Quem escreveu o bilhete e deixou a garrafa de bebida para o pai do Declan, em Abutre?","answers":["Melissa"]},{"id":28,"type":"boolean","q":"Na festa em que Killian e Lara se beijaram, Reid viu tudo e levou Lara nos ombros embora, com ciúmes.","answer":true},{"id":29,"type":"boolean","q":"Quando Olívia beijou Dex com batom de canela e ele começou a ter uma crise alérgica, ela foi embora e o deixou lá morrendo sozinho.","answer":false},{"id":30,"type":"boolean","q":"Quando Charlotte descobre toda a verdade por trás dos Cisnes, ela finge não saber de nada até Declan estar pronto para contar tudo.","answer":false},{"id":31,"type":"text","q":"Quem disse “Eu disse que sei que você tem namorado, não disse que me importo com isso.”?","answers":["Killian"]},{"id":32,"type":"boolean","q":"Quando os meninos descobrem que o pai de Reid tinha uma das armas que poderia ter sido usada para atirar em Killian, Reid descobre que o pai dele a vendeu para os pais da Melissa.","answer":true},{"id":33,"type":"boolean","q":"Quando Olívia pergunta a Dex por que ele matou o irmão dela, ele conta o verdadeiro motivo, e os dois se afastam por outra coisa.","answer":false},{"id":34,"type":"boolean","q":"Toda vez que alguém pergunta a Zuri qual é a profissão dos pais dela, ela diz algo diferente e nunca conta o que eles realmente fazem.","answer":true},{"id":35,"type":"boolean","q":"Chuck namorou Olívia por meses e nunca a beijou nenhuma vez.","answer":true},{"id":36,"type":"boolean","q":"Chuck sofre um acidente de carro enquanto estava indo para uma festa.","answer":false},{"id":37,"type":"boolean","q":"Depois que Olívia foi embora, Dex ficou com várias meninas como uma forma de superá-la.","answer":false},{"id":38,"type":"text","q":"Quem disse “Eu sou como a Tinkerbell quando alguém diz que não acredita em fadas. Se continuar chamando outro homem de gostoso, eu morro.”?","answers":["Killian"]},{"id":39,"type":"boolean","q":"Reid usa o número 9 porque é o número favorito de Lara.","answer":true},{"id":40,"type":"boolean","q":"Dex fica bêbado depois que Olívia vai embora, e todos os meninos acabam bebendo com ele e cantando “Bad Day”.","answer":true},{"id":41,"type":"boolean","q":"Durante o aniversário de Zuri em Abutre, Declan faz um show de drones como presente para ela.","answer":false},{"id":42,"type":"text","q":"Reid tinha um melhor amigo que jogava futebol americano com ele quando eram crianças. Qual o nome dele?","answers":["Kade"]}];
const STATE_KEY="phantasma_quiz_v70_state";
const qs=new URLSearchParams(location.search);
if(qs.has("reset"))sessionStorage.removeItem(STATE_KEY);
const SITE_ROOT=location.hostname.endsWith("github.io")?"/arquivoconfidencial/":"./";
const $=id=>document.getElementById(id);
const card=$("card"),questionEl=$("question"),typeLabel=$("typeLabel"),answerZone=$("answerZone"),
      feedback=$("feedback"),meta=$("meta"),curtain=$("curtain"),bits=$("bits");
const pips=[...document.querySelectorAll(".pip")];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function fresh(){
  return {deck:shuffle(QUESTIONS.map(q=>q.id)),index:0,correct:0,errors:0,seen:[],current:null,attempts:0,finished:false};
}
let state;
try{state=JSON.parse(sessionStorage.getItem(STATE_KEY))||fresh()}catch(_){state=fresh()}
function save(){sessionStorage.setItem(STATE_KEY,JSON.stringify(state))}
function norm(v){return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^\p{L}\p{N}]+/gu," ").trim().replace(/\s+/g," ")}
function isCorrect(q,value){
  if(q.special==="money200k"){
    const n=norm(value);
    const digits=String(value).replace(/\D/g,"");
    return n==="200k"||n==="200 mil"||n==="duzentos mil"||digits==="200000"||digits==="20000000";
  }
  return q.answers.some(a=>norm(a)===norm(value));
}
function updatePips(){pips.forEach((p,i)=>p.classList.toggle("on",i<state.correct))}
let switchingQuestion=false;
function nextQuestion(){
  if(switchingQuestion)return;
  if(state.correct>=3){finish();return}
  switchingQuestion=true;
  card.classList.add("switching");
  setTimeout(()=>{
    feedback.textContent="";feedback.className="feedback";meta.textContent="";
    if(state.index>=state.deck.length){
      const last=state.current;
      state.deck=shuffle(QUESTIONS.map(q=>q.id));
      if(last&&state.deck[0]===last&&state.deck.length>1)[state.deck[0],state.deck[1]]=[state.deck[1],state.deck[0]];
      state.index=0;
    }
    state.current=state.deck[state.index++];
    state.attempts=0;
    if(!state.seen.includes(state.current))state.seen.push(state.current);
    save();renderCurrent();
    card.classList.remove("switching","arrive");
    void card.offsetWidth;
    card.classList.add("arrive");
    switchingQuestion=false;
  },300);
}
function renderCurrent(){
  updatePips();
  const q=QUESTIONS.find(x=>x.id===state.current);
  if(!q){nextQuestion();return}
  questionEl.textContent=q.q;
  if(q.type==="boolean"){
    typeLabel.textContent="AFIRMAÇÃO // VERDADEIRO OU FALSO";
    answerZone.innerHTML='<div class="bool"><button data-v="true">VERDADEIRO</button><button data-v="false">FALSO</button></div>';
    answerZone.querySelectorAll("button").forEach(b=>b.onclick=()=>answerBoolean(b.dataset.v==="true"));
    meta.textContent="uma escolha. depois, outra pergunta.";
  }else{
    typeLabel.textContent="VERIFICAÇÃO // RESPOSTA LIVRE";
    answerZone.innerHTML='<form id="answerForm"><input id="answerInput" autocomplete="off" autocapitalize="sentences" placeholder="digite sua resposta"><div class="actions"><button type="submit">CONFIRMAR</button></div></form>';
    const form=$("answerForm"),input=$("answerInput");
    form.onsubmit=e=>{e.preventDefault();answerText(input.value,input)};
    if(matchMedia("(pointer:fine)").matches && innerWidth>760) setTimeout(()=>input.focus({preventScroll:true}),80);
    meta.textContent="a pergunta é encerrada depois de três respostas incorretas.";
  }
}
function markGood(){
  state.correct++;save();updatePips();
  feedback.textContent="CORRETO.";feedback.className="feedback good";
  if(state.correct>=3){setTimeout(finish,800)}else setTimeout(nextQuestion,780);
}
function wrongFlash(text){
  state.errors++;save();
  feedback.textContent=text;feedback.className="feedback bad";
  card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");
}
function answerBoolean(v){
  const q=QUESTIONS.find(x=>x.id===state.current);
  answerZone.querySelectorAll("button").forEach(b=>b.disabled=true);
  if(v===q.answer){markGood();return}
  wrongFlash("INCORRETO. Essa afirmação acabou.");
  setTimeout(nextQuestion,1050);
}
function answerText(value,input){
  if(!value.trim())return;
  const q=QUESTIONS.find(x=>x.id===state.current);
  if(isCorrect(q,value)){input.disabled=true;markGood();return}
  state.attempts++;wrongFlash(state.attempts>=3?"INCORRETO. Próxima pergunta.":"INCORRETO.");
  if(state.attempts>=3){input.disabled=true;setTimeout(nextQuestion,1050)}
  else{input.select();save()}
}
function finish(){
  if(state.finished)return;
  state.finished=true;save();
  sessionStorage.setItem("phantasma_quiz_concluido","1");
  sessionStorage.setItem("phantasma_quiz_acertos",String(state.correct));
  sessionStorage.setItem("phantasma_quiz_erros",String(state.errors));
  sessionStorage.setItem("phantasma_quiz_perguntas_vistas",String(state.seen.length));
  bits.textContent=Array.from({length:420},()=>Math.random()<.5?"0":"1").join("");
  curtain.classList.add("show");
  setTimeout(()=>location.href=SITE_ROOT+"pistas.html",1100);
}
updatePips();
if(state.finished){state=fresh();save()}
if(!state.current){
  /* primeira pergunta entra suavemente, sem flash seco */
  card.classList.add("switching");
  setTimeout(()=>nextQuestion(),120);
}else{
  renderCurrent();
  card.classList.add("arrive");
}
</script>
</body>
</html>
