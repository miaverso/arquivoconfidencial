<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PHANTASMA // PAINEL // V72</title>
<style>
:root{--bg:#040605;--panel:#080c09;--line:rgba(218,236,224,.10);--fg:#e8eee9;--muted:#707b73;--g:#8fd2a6;--r:#d96f78;--a:#c9b77f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020302;color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 0,rgba(83,121,96,.10),transparent 36%),linear-gradient(#060906,#020302 75%)}
.wrap{width:min(900px,100%)}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:12px;color:#647068;font-size:10px;letter-spacing:.14em}
.pips{display:flex;gap:7px}.pip{width:7px;height:7px;border-radius:50%;border:1px solid #526158}.pip.on{background:var(--g);border-color:var(--g);box-shadow:0 0 12px rgba(143,210,166,.28)}
.panel{border:1px solid var(--line);background:rgba(7,11,8,.90);box-shadow:0 28px 90px rgba(0,0,0,.56);padding:clamp(20px,4vw,40px);transition:opacity .3s ease,transform .3s ease,filter .3s ease}
.panel.switching{opacity:0;transform:translateY(7px);filter:blur(4px)}
.panel.arrive{animation:panelArrive .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes panelArrive{from{opacity:0;transform:translateY(9px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.category{color:#67736b;font-size:10px;letter-spacing:.17em;margin-bottom:10px}.clue-main{font-size:clamp(34px,7vw,70px);font-weight:680;letter-spacing:-.05em;line-height:1;margin:8px 0 24px}
.clue-tag{color:#718078;font-size:9px;letter-spacing:.14em;margin-bottom:8px}
.clues{display:grid;gap:8px;margin:0 0 26px}
.clue{border-left:1px solid rgba(143,210,166,.20);padding:11px 12px;background:rgba(255,255,255,.018);color:#c8d4cc;font-size:13px;animation:clueIn .48s cubic-bezier(.2,.8,.2,1) both}
.clue strong{color:#6f7b73;font-weight:500;margin-right:9px}
@keyframes clueIn{from{opacity:0;transform:translateY(6px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
form{display:grid;grid-template-columns:1fr auto;gap:10px}input{min-width:0;border:1px solid rgba(231,240,234,.13);background:#050806;color:var(--fg);padding:13px 14px;font:inherit;outline:0}
input:focus{border-color:rgba(143,210,166,.46)}button{appearance:none;border:1px solid rgba(143,210,166,.30);background:#050806;color:#cfe2d5;padding:12px 17px;font:600 11px/1 inherit;letter-spacing:.08em;cursor:pointer}
button:hover{border-color:var(--g);background:rgba(143,210,166,.06)}.feedback{min-height:22px;margin-top:14px;color:#6d7971;font-size:12px}.feedback.bad{color:var(--r)}.feedback.good{color:var(--g)}.feedback.warn{color:var(--a)}
.offer{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:18px;background:rgba(0,0,0,.76);backdrop-filter:blur(8px)}.offer.show{display:grid}.offer-card{width:min(520px,100%);border:1px solid rgba(218,236,224,.12);background:#080c09;padding:26px;box-shadow:0 30px 100px #000}
.offer-tag{font-size:9px;letter-spacing:.15em;color:#657168}.offer-card h2{margin:10px 0 8px;font-size:clamp(25px,5vw,40px);letter-spacing:-.04em}.offer-card p{color:#8d9991;line-height:1.6}.offer-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.reveal{position:fixed;inset:0;z-index:25;display:none;place-items:center;background:#020302;padding:18px}.reveal.show{display:grid}.reveal div{text-align:center}.reveal small{color:#657168;letter-spacing:.14em}.reveal strong{display:block;margin-top:10px;font-size:clamp(35px,8vw,78px);letter-spacing:-.05em}
@media(max-width:620px){body{padding:10px}.panel{padding:24px 16px}form{grid-template-columns:1fr}form button{min-height:48px}.offer-actions{grid-template-columns:1fr}.clue-main{font-size:clamp(34px,13vw,58px)}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><span>PHANTASMA // PAINEL DE EVIDÊNCIAS</span><span class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i></span></div>
  <section class="panel" id="panel">
    <div class="category" id="category"></div>
    <div class="clue-tag">PISTA 1</div>
    <div class="clue-main" id="clueMain"></div>
    <div class="clues" id="clues"></div>
    <form id="form"><input id="answer" autocomplete="off" placeholder="sua resposta"><button>CONFIRMAR</button></form>
    <div class="feedback" id="feedback"></div>
  </section>
</main>
<div class="offer" id="offer">
  <div class="offer-card">
    <div class="offer-tag">AJUDA DISPONÍVEL</div>
    <h2 id="offerTitle">Outra pista?</h2>
    <p id="offerText">Você pode aceitar ajuda. Eu não disse que seria gratuita.</p>
    <div class="offer-actions"><button id="accept" type="button">ACEITAR</button><button id="decline" type="button">RECUSAR</button></div>
  </div>
</div>
<div class="reveal" id="reveal"><div><small id="revealTag">RESPOSTA REVELADA</small><strong id="revealAnswer"></strong></div></div>
<script>
"use strict";
const ROUNDS=[{"id":1,"category":"JUÍZES","answers":["Caspian"],"display":"CASPIAN","clues":["Rico","Estava no celeiro","Primeira morte"]},{"id":2,"category":"LUGAR","answers":["St. Tropez","St Tropez"],"display":"ST. TROPEZ","clues":["Kelissa","Lucas","Chifre"]},{"id":3,"category":"OBJETO","answers":["Cápsula"],"display":"CÁPSULA","clues":["Melissa","Chuck","Ivy Belrose"]},{"id":4,"category":"JUÍZES","answers":["JUSTITIA"],"display":"JUSTITIA","clues":["Gado","Ferro","A juíza do inferno"]},{"id":5,"category":"LUGAR // HARPIA","answers":["Red Hook","Pier"],"display":"RED HOOK / PIER","clues":["Carro","Killian","Declan"]},{"id":6,"category":"PESSOA // ABUTRE","answers":["Lana"],"display":"LANA","clues":["Cachorro","Armário","Cicatrizes"]},{"id":7,"category":"ABUTRE","answers":["Milane"],"display":"MILANE","clues":["Colo","Tempestade","Veterinário"]},{"id":8,"category":"JUÍZES","answers":["Hello Kitty","Kitty"],"display":"HELLO KITTY","clues":["Barulho","Nome","Porão"]},{"id":9,"category":"ALBATROZ","answers":["Estrela Ivy","Estrela"],"display":"ESTRELA IVY","clues":["Madrugada","Outubro","Presente"]},{"id":10,"category":"PESSOA","answers":["Reid Montgomery","Reid"],"display":"REID MONTGOMERY","clues":["Projeto","Bunny Bear","Novo Rico"]},{"id":11,"category":"OBJETO","answers":["Pen-Drive","Pendrive","Pen Drive"],"display":"PEN-DRIVE","clues":["Melissa","Encontro","Parque"]},{"id":12,"category":"PESSOA","answers":["Harry Loomis","Harry"],"display":"HARRY LOOMIS","clues":["Monstro","Segredo","Phantasma Original"]},{"id":13,"category":"PESSOA","answers":["Melissa Jang","Melissa","Mel"],"display":"MELISSA JANG","clues":["Segredo","Acidente","Sabotagem"]},{"id":14,"category":"COMIDA // ALBATROZ","answers":["Sorvete"],"display":"SORVETE","clues":["Dex","Olivia","Sabor"]},{"id":15,"category":"PESSOA","answers":["Dexter","Dex"],"display":"DEXTER","clues":["Festa","Ciúme","Incêndio"]},{"id":16,"category":"ALBATROZ","answers":["Canela","Batom"],"display":"CANELA / BATOM","clues":["Dex","Beijo","Alergia"]},{"id":17,"category":"PESSOA","answers":["Taylor Swift"],"display":"TAYLOR SWIFT","clues":["Aniversário","Feeling 22","Killian"]},{"id":18,"category":"ALBATROZ","answers":["32 tatuagens","32","trinta e duas"],"display":"32 TATUAGENS","clues":["Olivia","Quantidade","Tatuagem"]},{"id":19,"category":"ALBATROZ","answers":["schätzchen","schatzchen"],"display":"SCHÄTZCHEN","clues":["Pequeno Tesouro","Alemão","Olivia"]},{"id":20,"category":"OBJETO","answers":["Chaveiro"],"display":"CHAVEIRO","clues":["Melissa","Chuck","Acessório"]},{"id":21,"category":"PESSOA","answers":["Chuck","Charles"],"display":"CHARLES","clues":["Carro","Acidente","Phantasma"]},{"id":22,"category":"ABUTRE","answers":["Trisal","Capítulo 38","Capitulo 38","Cap 38"],"display":"TRISAL / CAPÍTULO 38","clues":["Declan","Charlotte","Killian"]},{"id":23,"category":"NOME","answers":["Monstrinho"],"display":"MONSTRINHO","clues":["Cicatriz","Apelido","Declan"]},{"id":24,"category":"COMIDA","answers":["Pizza de abacaxi","Pizza"],"display":"PIZZA DE ABACAXI","clues":["Sabor","Charlotte","Aniversário"]},{"id":25,"category":"PESSOA","answers":["Declan"],"display":"DECLAN","clues":["Parque","Eco","Pedrada"]},{"id":26,"category":"PESSOA","answers":["Ivy Belrose","Ivy"],"display":"IVY BELROSE","clues":["Dupla","Charlotte","Amiga"]},{"id":27,"category":"LUGAR","answers":["Roda gigante","Parque"],"display":"RODA GIGANTE / PARQUE","clues":["Alto","Drone","Lista"]},{"id":28,"category":"PESSOA","answers":["Phantasma"],"display":"PHANTASMA","clues":["Assassino","QR Code","Morto"]},{"id":29,"category":"ÓRGÃO","answers":["Olho"],"display":"OLHO","clues":["Vingança","Caspian","Comer"]}];
const STATE_KEY="phantasma_painel_v70_state";
const qs=new URLSearchParams(location.search);
if(qs.has("reset"))sessionStorage.removeItem(STATE_KEY);
const SITE_ROOT=location.hostname.endsWith("github.io")?"/arquivoconfidencial/":"./";
const $=id=>document.getElementById(id);
const category=$("category"),clueMain=$("clueMain"),clues=$("clues"),form=$("form"),answer=$("answer"),feedback=$("feedback"),
      offer=$("offer"),offerTitle=$("offerTitle"),offerText=$("offerText"),accept=$("accept"),decline=$("decline"),
      reveal=$("reveal"),revealAnswer=$("revealAnswer"),revealTag=$("revealTag");
const pips=[...document.querySelectorAll(".pip")];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function fresh(){return {deck:shuffle(ROUNDS.map(r=>r.id)),index:0,wins:0,rounds:0,current:null,level:1,errors:0,lastChance:false,extraCount:0,penalty:0,finished:false}}
let state;try{state=JSON.parse(sessionStorage.getItem(STATE_KEY))||fresh()}catch(_){state=fresh()}
function save(){
  sessionStorage.setItem(STATE_KEY,JSON.stringify(state));
  sessionStorage.setItem("phantasma_penalidade_tiro_segundos",String(state.penalty));
  sessionStorage.setItem("phantasma_pistas_extras",String(state.extraCount));
}
function norm(v){return String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^\p{L}\p{N}]+/gu," ").trim().replace(/\s+/g," ")}
function current(){return ROUNDS.find(r=>r.id===state.current)}
function correct(r,v){return r.answers.some(a=>norm(a)===norm(v))}
function updatePips(){pips.forEach((p,i)=>p.classList.toggle("on",i<state.wins))}
function extraCost(n){return Math.floor(n/2)+1}
let switchingRound=false;
function draw(){
  if(switchingRound)return;
  if(state.wins>=3){finish();return}
  switchingRound=true;
  panel.classList.add("switching");
  setTimeout(()=>{
    if(state.index>=state.deck.length){state.deck=shuffle(ROUNDS.map(r=>r.id));state.index=0}
    state.current=state.deck[state.index++];state.level=1;state.errors=0;state.lastChance=false;state.rounds++;save();render();
    panel.classList.remove("switching","arrive");void panel.offsetWidth;panel.classList.add("arrive");
    switchingRound=false;
  },320)
}
function render(){
  updatePips();const r=current();if(!r){draw();return}
  category.textContent="CATEGORIA // "+r.category;
  clueMain.textContent=r.clues[0];

  /* V71: pista não comprada simplesmente NÃO EXISTE visualmente. */
  const extras=[];
  if(state.level>=2) extras.push(`<div class="clue"><strong>PISTA 2</strong>${r.clues[1]}</div>`);
  if(state.level>=3) extras.push(`<div class="clue"><strong>PISTA 3</strong>${r.clues[2]}</div>`);
  clues.innerHTML=extras.join("");

  feedback.textContent="";feedback.className="feedback";answer.value="";answer.disabled=false;setTimeout(()=>answer.focus(),110)
}
function showOffer(nextLevel){
  offer.dataset.level=String(nextLevel);
  offerTitle.textContent=nextLevel===2?"Quer outra pista?":"Ainda precisa de mais?";
  offerText.textContent=nextLevel===2?"Você pode aceitar ajuda. Eu não disse que seria gratuita.":"Esta é a última pista disponível. A escolha continua sendo sua.";
  offer.classList.add("show")
}
function acceptHelp(){
  const next=Number(offer.dataset.level);offer.classList.remove("show");
  state.extraCount++;state.penalty+=extraCost(state.extraCount);state.level=next;state.errors=0;state.lastChance=false;save();

  const r=current();
  if(next===2){
    clues.insertAdjacentHTML("beforeend",`<div class="clue"><strong>PISTA 2</strong>${r.clues[1]}</div>`);
  }else{
    clues.insertAdjacentHTML("beforeend",`<div class="clue"><strong>PISTA 3</strong>${r.clues[2]}</div>`);
  }
  feedback.textContent="AJUDA ACEITA // custo registrado.";feedback.className="feedback warn";
  setTimeout(()=>answer.focus(),80);
}
function declineHelp(){offer.classList.remove("show");state.errors=0;save();feedback.textContent="Como quiser.";feedback.className="feedback"}
accept.onclick=acceptHelp;decline.onclick=declineHelp;
function loseRound(){
  const r=current();answer.disabled=true;revealTag.textContent="RESPOSTA REVELADA // RODADA NÃO VALIDADA";revealAnswer.textContent=r.display;reveal.classList.add("show");
  setTimeout(()=>{reveal.classList.remove("show");draw()},1900)
}
function winRound(){
  state.wins++;save();updatePips();answer.disabled=true;feedback.textContent="CORRETO.";feedback.className="feedback good";
  setTimeout(()=>state.wins>=3?finish():draw(),800)
}
function clearWrongAnswer(){
  answer.value="";
  requestAnimationFrame(()=>answer.focus());
}

function wrong(){
  state.errors++;
  save();
  clearWrongAnswer();
  feedback.textContent="INCORRETO.";
  feedback.className="feedback bad";

  if(state.level===1&&state.errors>=3){
    setTimeout(()=>showOffer(2),380);
    return;
  }

  if(state.level===2&&state.errors>=3){
    setTimeout(()=>showOffer(3),380);
    return;
  }

  if(state.level===3&&state.errors>=3&&!state.lastChance){
    state.lastChance=true;
    state.errors=0;
    save();
    feedback.textContent="ÚLTIMA CHANCE.";
    feedback.className="feedback warn";
    return;
  }

  if(state.level===3&&state.lastChance&&state.errors>=1){
    loseRound();
  }
}
form.onsubmit=e=>{
  e.preventDefault();const r=current(),v=answer.value.trim();if(!v)return;
  /* CORRETO vem antes do easter egg: PHANTASMA é resposta real em uma rodada. */
  if(correct(r,v)){winRound();return}
  if(norm(v)==="phantasma"){
    const lines=["Eu? Tentativa interessante.","Você me vê em todo lugar agora?","Adorável. Mas não.","Quase lisonjeiro."];
    feedback.textContent=lines[(Math.random()*lines.length)|0];
    feedback.className="feedback warn";
    state.errors++;
    save();
    clearWrongAnswer();

    if(state.level===1&&state.errors>=3)setTimeout(()=>showOffer(2),380);
    else if(state.level===2&&state.errors>=3)setTimeout(()=>showOffer(3),380);
    else if(state.level===3&&state.errors>=3&&!state.lastChance){
      state.lastChance=true;
      state.errors=0;
      save();
      setTimeout(()=>{feedback.textContent="ÚLTIMA CHANCE.";},280);
    }
    else if(state.level===3&&state.lastChance&&state.errors>=1)loseRound();
    return
  }

  wrong();
};
function finish(){
  if(state.finished)return;state.finished=true;save();
  sessionStorage.setItem("phantasma_painel_concluido","1");
  sessionStorage.setItem("phantasma_painel_acertos",String(state.wins));
  sessionStorage.setItem("phantasma_painel_rodadas",String(state.rounds));
  revealTag.textContent="PAINEL CONCLUÍDO";revealAnswer.textContent="3 VALIDAÇÕES CONFIRMADAS";reveal.classList.add("show");
  setTimeout(()=>location.href=SITE_ROOT+"tiro.html",1350)
}
if(state.finished){state=fresh();save()}
updatePips();
if(!state.current){
  panel.classList.add("switching");
  setTimeout(()=>draw(),100);
}else{
  render();
  panel.classList.add("arrive");
}
</script>
</body>
</html>
